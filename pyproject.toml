[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phyndr"
version = "0.3.3"
description = "Physics-guided heterogeneous GNN for regional/layer NDR evaluation"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.3,<2.4",
  "dgl==2.2.1",
  "torchdata==0.7.1",
  "numpy>=1.24,<2",
  "pandas>=2.0,<3",
  "pydantic>=2",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

